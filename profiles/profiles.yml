# Se versiona en el repo: no tiene secretos.
# Todos los targets usan las credenciales por defecto de Google (ADC):
#   - en tu máquina: gcloud auth application-default login
#   - en GitHub Actions: Workload Identity Federation (sin llaves JSON)
#   - en Cloud Run: la service account dbt-runner
# Uso: export DBT_PROFILES_DIR=profiles

dbt_bronze_gold:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'emra-co') }}"
      dataset: "{{ env_var('DBT_DEV_DATASET', 'dbt_emra') }}"   # → dbt_emra_bronze / _silver / _gold
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      maximum_bytes_billed: 1000000000

    ci:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'emra-co') }}"
      dataset: "{{ env_var('DBT_CI_DATASET', 'mkt_dbt_ci') }}"  # → mkt_dbt_ci_bronze / ...
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 4
      maximum_bytes_billed: 1000000000

    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT', 'emra-co') }}"
      dataset: "{{ env_var('DBT_PROD_DATASET', 'mkt_dbt') }}"   # → mkt_dbt_bronze / ...
      location: "{{ env_var('BQ_LOCATION', 'US') }}"
      threads: 8
      job_execution_timeout_seconds: 1800

version: 2

# Cuando lo conectes a tu tabla real de bronze, descomenta esto y usa
# {{ source('adverity', 'meta_ads_raw') }} en stg_meta_ads.sql
#
# sources:
#   - name: adverity
#     database: emra-co
#     schema: bronze
#     tables:
#       - name: meta_ads_raw

models:
  - name: stg_meta_ads
    description: "Meta Ads diario por campaña, tipado y deduplicado."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [report_date, campaign_id]
    columns:
      - name: report_date
        data_tests: [not_null]
      - name: campaign_id
        data_tests: [not_null]
      - name: country_code
        data_tests:
          - accepted_values:
              arguments:
                values: ['AR', 'BR', 'CL', 'CO', 'MX', 'PE', 'UY']
      - name: spend
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
